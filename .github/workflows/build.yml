name: build
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Новый пуш в ту же ветку отменяет предыдущий прогон. Без этого зависший тест
# держит раннер до дефолтного таймаута в шесть часов, а очередь копится.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    # Здоровый прогон укладывается в четыре минуты. Двадцати достаточно с запасом,
    # а зависший тест перестаёт стоить часы машинного времени.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      # Отладочный ключ генерируется на пустом раннере заново каждый прогон, из-за
      # чего подписи APK не совпадают и сборку нельзя поставить поверх предыдущей —
      # только с удалением. Кэш делает ключ постоянным, и обновление проходит как
      # обычно. Ключ отладочный: секретом не является и для распространения непригоден.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: 1 Конфигурация проекта
        run: gradle :app:tasks 2>&1 | tee -a /tmp/gradle.log

      - name: 2 Резолвинг зависимостей
        run: gradle :app:dependencies --configuration debugCompileClasspath 2>&1 | tee -a /tmp/gradle.log

      - name: 3 Компиляция main
        run: gradle :app:compileDebugKotlin 2>&1 | tee -a /tmp/gradle.log

      - name: 4 Компиляция тестов
        run: gradle :app:compileDebugUnitTestKotlin 2>&1 | tee -a /tmp/gradle.log

      - name: 5 Прогон тестов
        run: gradle :app:testDebugUnitTest 2>&1 | tee -a /tmp/gradle.log

      - name: 6 Сборка APK
        run: gradle :app:assembleDebug 2>&1 | tee -a /tmp/gradle.log

      - name: 7 Сборка release
        run: gradle :app:assembleRelease 2>&1 | tee -a /tmp/gradle.log

      - name: Опубликовать хвост ошибки в комментарий к коммиту
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          TAIL=$(tail -c 50000 /tmp/gradle.log 2>/dev/null || echo "лог отсутствует")
          python3 - "$TAIL" <<'PY' > payload.json
          import json, sys
          print(json.dumps({"body": "Падение CI. Хвост вывода Gradle:\n\n```\n" + sys.argv[1] + "\n```"}))
          PY
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/commits/$SHA/comments" \
            -d @payload.json

      - name: Отчёты тестов (при падении)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      # Release нужен для девятого шага ручной приёмки: в нём не должно быть
      # демо-устройств, а живая нода обязана находиться и подключаться.
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk

      # Прогон по метке дополнительно выкладывает APK в раздел Releases.
      # Делает это сам прогон, а не человек с машины: право записи в репозиторий
      # есть у GITHUB_TOKEN этого workflow (permissions выше), а у токенов,
      # которыми пользуются снаружи, его нет — и заводить такой токен ради
      # нескольких релизов в год значит держать лишний ключ с правом записи.
      #
      # Артефакты прогона живут ограниченное время и требуют входа в GitHub,
      # а файл в Releases доступен по прямой ссылке и не протухает — телефон
      # можно обновить, не разбираясь в устройстве CI.
      - name: Выложить APK в Releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Имена файлов в сборке обезличены (app-release.apk), и в списке
          # релизов их было бы не различить. Версия в имени решает это.
          cp app/build/outputs/apk/release/app-release.apk "mesh-test-$TAG-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "mesh-test-$TAG-debug.apk"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes "Сборка по метке $TAG. release — без демо-устройств, для работы с настоящей нодой; debug — с демо-устройствами, для отладки без ноды." \
            "mesh-test-$TAG-release.apk" \
            "mesh-test-$TAG-debug.apk"
